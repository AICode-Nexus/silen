name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Python for the pinned Agent Skills reference validator
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.0

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: >-
          pnpm format:check &&
          pnpm lint &&
          pnpm typecheck

      - name: Run official AI readiness gate
        run: pnpm site:ai-check

      - name: Install the pinned Agent Skills reference validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"

      - name: Validate the packaged read-only Agent Skill
        run: |
          skills-ref validate dist/agent/skills/silen-docs-readonly
          skills-ref read-properties dist/agent/skills/silen-docs-readonly

      - name: Upload AI evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: silen-ai-eval-publish
          path: artifacts/ai-eval/site-ai-eval.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Run release tests
        run: pnpm test:run

      - name: Validate package metadata
        run: pnpm exec publint

      - name: Publish package to npm
        run: npm publish --access public --tag latest
